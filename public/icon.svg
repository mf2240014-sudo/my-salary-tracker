<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="goldDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Deep Dark-Slate Rounded-Square Canvas -->
  <rect width="512" height="512" rx="112" fill="#152028" />

  <!-- Minimalist Golden-Amber Stacked Coins (Left) -->
  <rect x="96" y="362" width="110" height="30" rx="15" fill="url(#goldDeep)" />
  <rect x="96" y="320" width="110" height="30" rx="15" fill="url(#goldMain)" />
  <rect x="96" y="278" width="110" height="30" rx="15" fill="url(#goldDeep)" />
  <rect x="96" y="236" width="110" height="30" rx="15" fill="#fbbf24" />

  <!-- Ascending Fintech Bar Columns (Right) -->
  <rect x="234" y="286" width="44" height="106" rx="10" fill="#eab308" />
  <rect x="298" y="232" width="44" height="160" rx="10" fill="#f59e0b" />
  <rect x="362" y="178" width="44" height="214" rx="10" fill="#fbbf24" />

  <!-- Sharp Upward Growth Arrow (↗) -->
  <path
    d="M126 196 L236 144 L274 166 L392 104"
    fill="none"
    stroke="url(#goldMain)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M342 98 L398 102 L386 156"
    fill="none"
    stroke="#fbbf24"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
